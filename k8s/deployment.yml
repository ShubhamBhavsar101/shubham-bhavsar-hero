apiVersion: apps/v1
kind: Deployment
metadata:
  name: shubham-bhavsar-hero
  labels:
    app: shubham-bhavsar-hero
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shubham-bhavsar-hero
  template:
    metadata:
      labels:
        app: shubham-bhavsar-hero
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: shubham-bhavsar-hero
          image: shubhszone/shubhambhavsarhero:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "400m"
            limits:
              memory: "64Mi"
              cpu: "450m"
