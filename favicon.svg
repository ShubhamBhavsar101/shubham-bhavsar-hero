<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ink editorial background -->
  <rect width="64" height="64" rx="12" fill="#0a0908"/>
  <!-- Hairline gold border, echoing the brand square -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="10" fill="none" stroke="#b4924c" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- Bone serif-italic "S" monogram -->
  <text x="32" y="47" text-anchor="middle" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="42" fill="#e8e4dc">S</text>
  <!-- Gold editorial underline rule -->
  <rect x="24" y="51" width="16" height="2" fill="#c9a355"/>
</svg>
